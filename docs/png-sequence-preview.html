<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNG Sequence Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a14;
        --panel: #151522;
        --panel-2: #1d1d2e;
        --text: #ececf4;
        --muted: #9d9db8;
        --accent: #7c3aed;
        --accent-2: #06b6d4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(124, 58, 237, 0.18), transparent 35%),
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          var(--bg);
        background-size: 100% 100%, 28px 28px, 28px 28px, auto;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        padding: 20px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(12, 12, 20, 0.88);
        backdrop-filter: blur(14px);
      }

      .viewer {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .stage {
        width: min(72vw, 840px);
        aspect-ratio: 1 / 1;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          #0c0c18;
        background-size: 24px 24px, 24px 24px, auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 14px;
      }

      .controls {
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      button,
      input[type="number"],
      input[type="range"],
      input[type="file"] {
        width: 100%;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 12px;
        color: white;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }

      button.secondary {
        background: var(--panel-2);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      input[type="number"] {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 10px 12px;
      }

      input[type="file"] {
        color: var(--muted);
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .stats {
        display: grid;
        gap: 8px;
        font-size: 12px;
      }

      .stats div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .hint {
        font-size: 11px;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .viewer {
          order: -1;
          padding-top: 10px;
        }

        .stage {
          width: min(92vw, 560px);
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>PNG Sequence Preview</h1>
        <p>Preview hasil export `PNG Sequence`. Pilih `png-sequence.json` dan semua frame PNG dari folder `frames/` dalam satu kali pilih.</p>

        <div class="card controls">
          <div class="row">
            <button id="toggleBtn">Pause</button>
            <button id="resetBtn" class="secondary">Reset</button>
          </div>

          <div>
            <label for="fpsInput">Playback FPS</label>
            <input id="fpsInput" type="number" min="1" max="120" step="1" value="24" />
          </div>

          <div>
            <label for="scaleInput">Preview Scale</label>
            <input id="scaleInput" type="range" min="0.25" max="4" step="0.05" value="1" />
          </div>

          <div>
            <label for="frameInput">Frame</label>
            <input id="frameInput" type="range" min="0" max="0" step="1" value="0" />
          </div>
        </div>

        <div class="card controls">
          <div>
            <label for="filesInput">Load JSON + PNG frames</label>
            <input id="filesInput" type="file" accept=".json,.png,application/json,image/png" multiple />
          </div>
          <div class="hint">Pilih `png-sequence.json` beserta semua PNG di folder `frames/`. Browser tidak bisa membaca folder ZIP langsung, jadi extract dulu ZIP-nya.</div>
        </div>

        <div class="card stats" id="stats"></div>
      </aside>

      <main class="viewer">
        <div class="stage">
          <canvas id="canvas"></canvas>
        </div>
      </main>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const stage = document.querySelector(".stage");
      const toggleBtn = document.getElementById("toggleBtn");
      const resetBtn = document.getElementById("resetBtn");
      const fpsInput = document.getElementById("fpsInput");
      const scaleInput = document.getElementById("scaleInput");
      const frameInput = document.getElementById("frameInput");
      const filesInput = document.getElementById("filesInput");
      const stats = document.getElementById("stats");

      let manifest = {
        app: "SpineBones",
        version: "1.0",
        fps: 24,
        frameCount: 0,
        frameSize: { w: 1024, h: 1024 },
        frames: [],
      };
      let currentFrame = 0;
      let playing = true;
      let previewScale = Number(scaleInput.value);
      let playbackFps = Number(fpsInput.value);
      let lastTime = 0;
      let viewWidth = 840;
      let viewHeight = 840;
      const imageCache = new Map();

      const resizeCanvas = () => {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        viewWidth = Math.max(1, Math.round(rect.width));
        viewHeight = Math.max(1, Math.round(rect.height));
        canvas.width = Math.round(viewWidth * dpr);
        canvas.height = Math.round(viewHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
      };

      const updateStats = () => {
        const frame = manifest.frames[currentFrame];
        stats.innerHTML = `
          <div><span>Total Frames</span><strong>${manifest.frameCount}</strong></div>
          <div><span>Current Frame</span><strong>${currentFrame}</strong></div>
          <div><span>Playback FPS</span><strong>${playbackFps}</strong></div>
          <div><span>Frame File</span><strong>${frame?.file ?? "-"}</strong></div>
          <div><span>Frame Size</span><strong>${manifest.frameSize.w}x${manifest.frameSize.h}</strong></div>
          <div><span>Preview Scale</span><strong>${previewScale.toFixed(2)}x</strong></div>
        `;
      };

      const drawFrame = async () => {
        const frame = manifest.frames[currentFrame];
        if (!frame) {
          ctx.clearRect(0, 0, viewWidth, viewHeight);
          updateStats();
          return;
        }

        const image = imageCache.get(frame.file);
        if (!image || !image.complete) return;

        ctx.clearRect(0, 0, viewWidth, viewHeight);

        const targetWidth = manifest.frameSize.w * previewScale;
        const targetHeight = manifest.frameSize.h * previewScale;
        const drawX = (viewWidth - targetWidth) / 2;
        const drawY = (viewHeight - targetHeight) / 2;
        ctx.drawImage(image, drawX, drawY, targetWidth, targetHeight);

        updateStats();
      };

      const tick = (time) => {
        if (!lastTime) lastTime = time;
        const elapsed = time - lastTime;
        const frameDuration = 1000 / Math.max(1, playbackFps);

        if (playing && manifest.frames.length > 0 && elapsed >= frameDuration) {
          currentFrame = (currentFrame + 1) % manifest.frames.length;
          frameInput.value = String(currentFrame);
          lastTime = time;
          drawFrame();
        }

        requestAnimationFrame(tick);
      };

      const loadFiles = async (files) => {
        const manifestFile = files.find((file) => file.name === "png-sequence.json");
        if (!manifestFile) {
          alert("Please select png-sequence.json together with the frame PNG files.");
          return;
        }

        const nextManifest = JSON.parse(await manifestFile.text());
        const fileMap = new Map(files.map((file) => [file.name, file]));
        const nextCache = new Map();

        for (const frame of nextManifest.frames ?? []) {
          const fileName = frame.file.split("/").pop();
          const imageFile = fileMap.get(fileName);
          if (!imageFile) continue;

          const url = URL.createObjectURL(imageFile);
          const image = new Image();
          image.src = url;
          await image.decode().catch(() => undefined);
          nextCache.set(frame.file, image);
        }

        manifest = nextManifest;
        playbackFps = manifest.fps ?? 24;
        fpsInput.value = String(playbackFps);
        currentFrame = 0;
        frameInput.max = String(Math.max(0, manifest.frames.length - 1));
        frameInput.value = "0";
        imageCache.clear();
        nextCache.forEach((value, key) => imageCache.set(key, value));
        drawFrame();
      };

      toggleBtn.addEventListener("click", () => {
        playing = !playing;
        toggleBtn.textContent = playing ? "Pause" : "Play";
      });

      resetBtn.addEventListener("click", () => {
        currentFrame = 0;
        frameInput.value = "0";
        drawFrame();
      });

      fpsInput.addEventListener("input", () => {
        playbackFps = Math.max(1, Number(fpsInput.value) || 1);
        updateStats();
      });

      scaleInput.addEventListener("input", () => {
        previewScale = Number(scaleInput.value);
        drawFrame();
      });

      frameInput.addEventListener("input", () => {
        currentFrame = Number(frameInput.value);
        drawFrame();
      });

      filesInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files ?? []);
        if (files.length === 0) return;
        await loadFiles(files);
      });

      window.addEventListener("resize", () => {
        resizeCanvas();
        drawFrame();
      });

      resizeCanvas();
      updateStats();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
